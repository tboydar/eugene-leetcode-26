<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今天我刷 LeetCode — 2026-10-15 今日三題（3D 視覺化解題）</title>
  <meta name="description" content="以 three.js 3D 視覺化一步步看懂 56. Merge Intervals、88. Merge Sorted Array、26. Remove Duplicates from Sorted Array 的解題過程（台灣正體中文）" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/addons/"
      }
    }
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>今天我刷 LeetCode <span class="sub">eugene-leetcode-26</span></h1>
      <p class="meta">📅 2026-10-15 今日三題 ・ 🎯 排序 / 合併 / 雙指針 ・ 🕹️ three.js 3D 視覺化解題過程</p>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-id="56" aria-selected="false">
        <span class="num">56</span> Merge Intervals<span class="badge hard">難題・中等</span>
      </button>
      <button class="tab" data-id="88" aria-selected="false">
        <span class="num">88</span> Merge Sorted Array<span class="badge easy">簡單</span>
      </button>
      <button class="tab" data-id="26" aria-selected="false">
        <span class="num">26</span> Remove Duplicates<span class="badge easy">簡單</span>
      </button>
    </nav>
  </header>

  <main class="layout">
    <!-- 左側：題目內容 -->
    <aside class="sidebar" id="sidebar" aria-label="題目說明"></aside>

    <!-- 右側：3D 場景與控制 -->
    <section class="stage-area">
      <div class="stage" id="stage" aria-label="3D 解題視覺化場景"></div>
      <div class="controls">
        <div class="ctrl-buttons">
          <button id="btn-play" class="primary" title="播放或暫停">▶ 播放</button>
          <button id="btn-step" title="單步執行下一個動作">⏭ 單步</button>
          <button id="btn-reset" title="重置場景">↺ 重置</button>
          <label class="speed">速度
            <input id="speed" type="range" min="0.3" max="3" step="0.1" value="1" />
            <span id="speed-val">1.0x</span>
          </label>
        </div>
        <div class="status">
          <div class="step-bar"><div class="step-fill" id="step-fill"></div></div>
          <div class="step-text">
            <span id="step-count">步驟 0 / 0</span>
            <span id="step-label">準備中…</span>
          </div>
        </div>
      </div>
      <div class="hint">🖱 拖曳旋轉 ・ 滾輪縮放 ・ 右鍵平移</div>
    </section>
  </main>

  <footer class="footbar">
    <span>eugene-leetcode-26 ・ 台灣正體中文 ・ LeetCode 題目歸 LeetCode 所有，僅供學習。</span>
    <a href="https://github.com/tboydar/eugene-leetcode-26" target="_blank" rel="noopener">GitHub</a>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
